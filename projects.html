<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Projects | Tyson Warner</title>
    <link rel="stylesheet" href="projects_style.css">
</head>
<body>
    <section class="projects">
        <h2>Projects</h2>

        <div class="carousel" id="projCarousel">
            <article class="card">PID Temperature Controller</article>
            <article class="card">Bayesian Image Denoising</article>
            <article class="card">Orbital Analysis Simulator</article>
            <article class="card">Audio Equalizer</article>
            <article class="card">CT Scanner Simulator</article>
            <article class="card">Roche Limit Visualizer</article>
            <article class="card">Poisson RNG Toolkit</article>
            <article class="card">Convolution Animator</article>
            <article class="card">Set Theory Notes</article>
            <article class="card">FE Exam Tracker</article>
        </div>

        <div class="controls">
            <button class="nav prev" aria-label="Previous">‹</button>
            <button class="nav next" aria-label="Next">›</button>
        </div>
    </section>
    <script>
        // Buttons scroll by one “viewport” width of the carousel
        const wrap = document.getElementById('projCarousel');
        const prev = document.querySelector('.prev');
        const next = document.querySelector('.next');

        function pageWidth(){ return wrap.clientWidth; }
        prev.addEventListener('click', () => wrap.scrollBy({ left: -pageWidth(), behavior:'smooth' }));
        next.addEventListener('click', () => wrap.scrollBy({ left:  pageWidth(), behavior:'smooth' }));
    </script>



</body>
</html>
